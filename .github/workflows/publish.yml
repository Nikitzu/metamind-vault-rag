name: Publish

# Two jobs on purpose. Everything that can say no runs first, with no
# environment attached, so a reviewer approves against green checks rather than
# against an intention. Only the upload sits behind the gate, and it uploads
# exactly what the first job built.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Read the declared version
        id: version
        run: echo "value=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.version.outputs.value }}" ]; then
            echo "::error::tag $TAG does not match pyproject version ${{ steps.version.outputs.value }}"
            exit 1
          fi

      - name: Verify the version is not already published
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/metamind-vault-rag/${VERSION}/json")"
          if [ "$CODE" = "200" ]; then
            echo "::error::version ${VERSION} is already on PyPI. A published version cannot be replaced."
            exit 1
          fi
          echo "::notice::${VERSION} is unpublished (HTTP ${CODE})"

      - name: Run the suite
        run: uv run --extra dev pytest -q

      - name: Build
        run: uv build

      - name: Check distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Keep the artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: astral-sh/setup-uv@v6

      - name: Take the artifacts the verify job built
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Nothing is rebuilt here. What was checked is what is uploaded.
      - name: Publish
        run: uv publish --trusted-publishing always

      - name: Say what landed
        run: echo "::notice::published metamind-vault-rag ${{ needs.verify.outputs.version }}"
