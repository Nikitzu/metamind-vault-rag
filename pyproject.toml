[project]
name = "metamind-vault-rag"
version = "0.10.1"
description = "Markdown corpus retrieval engine: watcher, indexer, hybrid search, MCP server."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikitzu" }]
keywords = ["rag", "retrieval", "embeddings", "sqlite-vec", "markdown", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # mcp 2.0 removed mcp.server.fastmcp (moved to the separate fastmcp
    # package); server.py imports it, so stay on the 1.x line.
    "mcp>=1.0,<2",
    "watchfiles>=0.22",
    # sqlite-vec ships a SQLite extension wheel; loaded at runtime via
    # connection.enable_load_extension. ~3 MB, no native build step. v0.5.0
    # makes this the default vector store; Qdrant stays as a legacy backend.
    "sqlite-vec>=0.1.6",
    # fastembed runs ONNX embedding models in-process. Default model
    # (BAAI/bge-small-en-v1.5, 384-dim, ~30 MB) auto-downloads to
    # ~/.cache/fastembed/ on first use. v0.5.0 makes this the default
    # embedding backend; Ollama stays as a legacy backend.
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# `rerank` is the cross-encoder rescore tier. Opt-in - the default install
# stays slim. Users enable via `uv tool install 'metamind-vault-rag[rerank]'`.
#
# As of v0.5.2 we run the reranker through onnxruntime + the Rust-backed
# tokenizers crate, dropping the FlagEmbedding + transformers + torch stack
# (~2 GB) for ~60 MB of native binaries. The model itself stays the same:
# BAAI's bge-reranker-v2-m3, served via the Xenova ONNX export.
rerank = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.20",
]

[project.scripts]
metamind-vault-rag-server = "metamind_vault_rag.server:main"
metamind-vault-rag-watcher = "metamind_vault_rag.watcher:main"
metamind-vault-rag-indexer = "metamind_vault_rag.indexer:main"
metamind-vault-rag-doctor = "metamind_vault_rag.doctor:main"
metamind-vault-rag-http = "metamind_vault_rag.http_server:main"
metamind-vault-rag-query = "metamind_vault_rag.query:main"

[project.urls]
Source = "https://github.com/Nikitzu/metamind-vault-rag"
Issues = "https://github.com/Nikitzu/metamind-vault-rag/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metamind_vault_rag"]
